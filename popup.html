<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <style>
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --accent: #38bdf8;
                --accent-hover: #0284c7;
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --kofi-color: #facc15;
                --color-exito: #4ade80;
                --color-info: #38bdf8;
                --color-error: #f87171;
            }
            body {
                width: 300px;
                padding: 16px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: var(--text-main);
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin: 0;
                box-sizing: border-box;
            }
            h2 {
                margin: 0 0 4px 0;
                font-size: 1.15rem;
                font-weight: 700;
                text-align: center;
                letter-spacing: -0.5px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            textarea {
                width: 100%;
                height: 76px;
                border-radius: 8px;
                border: 1px solid #334155;
                background-color: rgba(15, 23, 42, 0.6);
                color: var(--text-main);
                padding: 10px;
                box-sizing: border-box;
                resize: none;
                font-size: 0.85rem;
                outline: none;
                transition: all 0.2s ease;
            }
            textarea:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
            }
            textarea::placeholder {
                color: var(--text-sub);
            }
            button {
                background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
                color: #ffffff;
                border: none;
                padding: 10px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
                font-size: 0.9rem;
                box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
                transition: all 0.2s ease;
            }
            button:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);    
            }

            button:active {
                transform: translateY(0);    
            }

            #status {
                font-size: 0.78rem;
                text-align: center;
                min-height: 16px;
                color: #4ade80;
                font-weight: 500;
            }

    
            .kofi {
                display: inline-block;
                text-align: center;
                color: var(--kofi-color);
                font-size: 0.75rem;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.9;
                transition: all 0.2s ease;
                margin-top: 2px;
            }

    
            .kofi:hover {
                opacity: 1;
                transform: scale(1.02);
                text-decoration: underline;
            }

        </style> 
    </head>
    <body>
        <h2 data-i18n="extensionName">CleanClip 🧹 </h2>
        <textarea id="urlInput" placeholder="Pega tu enlace aqui">  </textarea>
        <button id="cleanBtn" data-i18n="cleanAndCopyButton">Limpiar y copiar</button>
        <div id="status"></div>
        <a class="kofi" data-i18n="kofiLink" href="https://ko-fi.com/sebasurl123" target="_blank">Si la extension te ha servido apoyame.</a>
        <script src="popup.js"></script>
    </body>
</html>
